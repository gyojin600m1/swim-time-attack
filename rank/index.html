<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>みんなのランキング — 超・水泳タイムアタック</title>
<meta name="description" content="超・水泳タイムアタック全5種目のみんなのタイムランキング。ゴールすると自動で載ります。">
<style>
  :root{color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:#030914;color:#e8f4ff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background-image:radial-gradient(circle at 50% 0%,rgba(34,211,238,.14),transparent 42%);
    padding:16px 12px calc(30px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-text-size-adjust:100%}
  .wrap{width:min(480px,100%);margin:0 auto}
  h1{font-size:clamp(20px,6vw,26px);font-weight:900;text-align:center;line-height:1.3;
    background:linear-gradient(90deg,#22d3ee,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:7px 0 14px;text-align:center;color:#67e8f9;font-size:11px;font-weight:800;letter-spacing:.14em}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}
  .chip{min-height:46px;display:flex;align-items:center;justify-content:center;padding:8px 4px;
    border:1px solid #1e3a5f;border-radius:999px;background:#0b1526;color:#7fb3d5;font-size:12px;font-weight:800}
  .chip.on{background:rgba(34,211,238,.16);border-color:#22d3ee;color:#a5f3fc}
  .dists{display:flex;gap:6px;margin-bottom:12px}
  .dists .chip{flex:1}
  .row{display:flex;align-items:center;gap:10px;padding:11px;margin:7px 0;border-radius:12px;
    background:#0b1526;border:1px solid #16283f}
  .row.me{background:rgba(34,211,238,.1);border-color:#22d3ee}
  .no{flex:none;width:36px;text-align:center;font-size:16px;font-weight:900;color:#7fb3d5}
  .no.t1{color:#fbbf24;font-size:21px}.no.t2{color:#cbd5e1;font-size:19px}.no.t3{color:#d97706;font-size:19px}
  .nm{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv{flex:none;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
  .gap{flex:none;width:56px;text-align:right;font-size:10.5px;color:#64748b;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:#64748b;font-size:12.5px;padding:26px 8px;line-height:1.9}
  .lead{text-align:center;color:#64748b;font-size:11.5px;line-height:1.8;margin:14px 0}
  .games{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
  .games a{display:flex;align-items:center;gap:7px;min-height:48px;padding:11px 9px;border:1px solid #1e3a5f;
    border-radius:11px;background:#0b1526;color:#e8f4ff;text-decoration:none;font-size:12.5px;font-weight:800}
  .foot{margin-top:20px;text-align:center;font-size:10.5px;color:#64748b;line-height:1.9}
  .viewCounterWrap{margin:8px 0;text-align:center}
  .viewCounter{display:none;align-items:center;gap:6px;padding:5px 12px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:800;line-height:1.5;opacity:.7}
  .viewCounter.on{display:inline-flex}
  .viewCounter strong{font-size:13px;font-weight:900}
  @media(max-width:340px){.tabs{grid-template-columns:repeat(2,1fr)}.games{grid-template-columns:1fr}.gap{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 みんなのランキング</h1>
  <div class="sub">SUPER SWIM TIME ATTACK</div>
  <div class="viewCounterWrap"><span class="viewCounter" id="viewCounter">👀 のべ閲覧 <strong id="viewCount">-</strong> 回</span></div>

  <div class="tabs" id="evTabs"></div>
  <div class="dists" id="distTabs"></div>
  <div id="board"><div class="empty">読み込み中…</div></div>

  <div class="lead">ゲームでゴールすると、タイムはここに自動で載ります。<br>送信ボタンはありません。</div>

  <div class="games" id="games"></div>

  <div class="foot">
    <a href="../" style="color:#22d3ee">← ゲーム一覧</a><br>
    <span style="color:#e8f4ff;font-weight:700">&copy; 2026 gyojin600m1 無断複製・再配布を禁じます。</span>
  </div>
</div>

<script>
(function(){
"use strict";
var PROJECT="flutter-ai-playground-1e47f";
var APIKEY="AIzaSyBh64BsqNEpwA0cKkbnnyFVu0hI5LA9P-4";
var BASE="https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents/gameScores";

var EVENTS=[
  {e:"FR",label:"自由形",emoji:"🏊",url:"../freestyle/",dists:[50,100]},
  {e:"BK",label:"背泳ぎ",emoji:"🛌",url:"../backstroke/",dists:[50,100]},
  {e:"BR",label:"平泳ぎ",emoji:"🐸",url:"../breaststroke/",dists:[50,100]},
  {e:"FL",label:"バタフライ",emoji:"🦋",url:"../butterfly/",dists:[50,100]},
  {e:"IM",label:"個人メドレー",emoji:"🏅",url:"../im/",dists:[100,200]}
];
var EVMAP={};EVENTS.forEach(function(v){EVMAP[v.e]=v;});
var view={e:"FR",d:50};
var all=[];

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fmt(t){t=Number(t);if(!isFinite(t)||t<=0)return "-";
  if(t<60)return t.toFixed(2);
  var m=Math.floor(t/60),s=t-m*60;return m+":"+(s<10?"0":"")+s.toFixed(2);}
function myName(){try{return localStorage.getItem("swimrank:name")||"";}catch(e){return "";}}

// Firestore のドキュメント配列を素直な形に変換する
function toRows(docs){
  return (docs||[]).map(function(d){
    var f=d.fields||{};
    return {
      n:(f.n&&f.n.stringValue)||"",
      e:(f.e&&f.e.stringValue)||"",
      d:Number((f.d&&f.d.integerValue)||0),
      t:Number((f.t&&(f.t.doubleValue!==undefined?f.t.doubleValue:f.t.integerValue))||0)
    };
  }).filter(function(r){return r.n&&r.e&&r.t>0;});
}
function load(){
  var url=BASE+"?key="+APIKEY+"&pageSize=300&orderBy=t";
  return fetch(url,{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(j){all=toRows(j.documents);render();})
    .catch(function(){
      if(!all.length)$("board").innerHTML='<div class="empty">ランキングを読み込めませんでした。<br>電波を確認してもう一度開いてください。</div>';
    });
}
// 同じ名前の人は一番速いタイムだけ残す
function best(list){
  var map={};
  list.forEach(function(r){
    var k=r.n.toLowerCase();
    if(!map[k]||r.t<map[k].t)map[k]=Object.assign({},r,{tries:0});
    map[k].tries++;
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.t-b.t;});
}
function render(){
  Array.prototype.forEach.call($("evTabs").children,function(b){b.classList.toggle("on",b.dataset.e===view.e);});
  $("distTabs").innerHTML=EMVDists();
  var list=best(all.filter(function(r){return r.e===view.e&&r.d===view.d;}));
  if(!list.length){
    $("board").innerHTML='<div class="empty">この種目はまだ記録なし。<br><b style="color:#a5f3fc">最初の1位</b>になれます。</div>';
    return;
  }
  var top=list[0].t, me=myName().toLowerCase();
  $("board").innerHTML=list.slice(0,50).map(function(r,i){
    var isMe=me&&r.n.toLowerCase()===me;
    return '<div class="row'+(isMe?" me":"")+'">'
      +'<div class="no'+(i<3?" t"+(i+1):"")+'">'+(i+1)+'</div>'
      +'<div class="nm">'+esc(r.n)+(isMe?' <span style="font-size:9px;color:#a5f3fc">YOU</span>':'')+'</div>'
      +'<div class="tv">'+fmt(r.t)+'</div>'
      +'<div class="gap">'+(i===0?"👑":"+"+(r.t-top).toFixed(2))+'</div></div>';
  }).join("");
}
function EMVDists(){
  return EVMAP[view.e].dists.map(function(d){
    return '<button class="chip'+(d===view.d?" on":"")+'" type="button" data-d="'+d+'">'+d+'m</button>';
  }).join("");
}
function boot(){
  $("evTabs").innerHTML=EVENTS.map(function(v){
    return '<button class="chip" type="button" data-e="'+v.e+'">'+v.emoji+" "+v.label+'</button>';
  }).join("");
  $("games").innerHTML=EVENTS.map(function(v){
    return '<a href="'+v.url+'">'+v.emoji+" "+v.label+'</a>';
  }).join("");
  $("evTabs").addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-e]");if(!b)return;
    view.e=b.dataset.e;view.d=EVMAP[view.e].dists[0];render();
  });
  $("distTabs").addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-d]");if(!b)return;
    view.d=Number(b.dataset.d);render();
  });
  var h=(location.hash||"").replace("#","");
  var m=h.match(/^([A-Z]{2})(\d+)$/);
  if(m&&EVMAP[m[1]]){view.e=m[1];view.d=Number(m[2]);}
  render();load();
  setInterval(function(){if(!document.hidden)load();},10000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)load();});
}
boot();
})();
</script>

<script>
// 閲覧カウンター: Abacus(無料API)に累計値を保存。1日1回だけ加算し、失敗時は非表示のまま。
(function(){
  var NS="gyojin600m1-swim-rank";
  var isLocal=location.protocol==="file:"||/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname)||location.hostname==="";
  var KEY=isLocal?"views-dev":"views";
  var d=new Date();
  var today=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  var stampKey="viewCounterStamp:"+NS+":"+KEY;
  var counted=false;
  try{counted=localStorage.getItem(stampKey)===today;}catch(e){}
  fetch("https://abacus.jasoncameron.dev/"+(counted?"get":"hit")+"/"+NS+"/"+KEY)
    .then(function(r){if(!r.ok)throw new Error();return r.json();})
    .then(function(data){
      if(typeof data.value!=="number")throw new Error();
      var el=document.getElementById("viewCounter");
      if(!el)return;
      document.getElementById("viewCount").textContent=data.value.toLocaleString("ja-JP");
      el.classList.add("on");
      if(!counted){try{localStorage.setItem(stampKey,today);}catch(e){}}
    })
    .catch(function(){});
})();
</script>
</body>
</html>
